<HTML>
    <script>    
        var num = 1
        for (let i =0; i < 30; i++){
            if (num % 3 == 0 && num % 5 == 0)
                console.log(num ," Fizzbuzz")
            else if (num % 3 == 0)
                console.log(num, " Fizz")
            else if (num % 5 == 0)
                console.log(num, " Buzz")
            num ++
}        
    </script>
</HTML>
